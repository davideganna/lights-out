services:
  lights-out:
    build: .
    env_file: .env
    volumes:
      - agent-data:/data
      # GitHub App private key (see README "Using a GitHub App"):
      # - ./github-app.pem:/run/secrets/github-app.pem:ro
      # Compose can't make a bind mount optional (a missing source becomes a directory), so enable this
      # line once ./lights-out.yaml exists:
      # - ./lights-out.yaml:/app/lights-out.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"   # morning report: http://localhost:8080/
    restart: unless-stopped
    stop_grace_period: 30s  # time for the shutdown cleanup (Trello calls) before SIGKILL

volumes:
  agent-data:
