name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t lights-out .
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint lights-out lights-out --help
          docker run --rm --entrypoint claude-as-agent lights-out --version
