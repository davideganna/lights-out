[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lights-out"
version = "0.1.0"
description = "Orchestrator that lets any repository be developed from Trello (or Jira) tickets by Claude agents: triage, implement, test, review, PR, merge."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "davideganna" }]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.187",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
lights-out = "lights_out.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lights_out = ["templates/*.html", "templates/bootstrap/*", "templates/bootstrap/.github/workflows/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# eval/tasks/*/acceptance tests import the sample repository's package.
known-first-party = ["ledger"]
