[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-agent"
version = "0.1.0"
description = "Autonomous engineer: picks queued Trello cards, implements them, opens and merges GitHub PRs."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.187",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ticket-agent = "ticket_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_agent = ["templates/bootstrap/*", "templates/bootstrap/.github/workflows/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
